<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Market-anchored adaptive conformal forecast triage</title>
<style>
  :root { --bg:#ffffff; --fg:#172033; --muted:#5b6475; --line:#64748b;
    --neutral:#e2e8f0; --input:#dbeafe; --process:#e0e7ff;
    --storage:#ccfbf1; --external:#fef3c7; --risk:#fee2e2; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.4 Arial, Helvetica, sans-serif; }
  main { max-width:1200px; margin:20px auto; padding:0 16px; }
  svg { width:100%; height:auto; display:block; }
  .title{font-size:22px;font-weight:700;fill:var(--fg)}
  .label{font-size:15px;font-weight:700;fill:var(--fg)}
  .small{font-size:12px;fill:var(--muted)}
  .tiny{font-size:11px;fill:var(--muted)}
  .node{stroke:var(--line);stroke-width:1.2}
  .input{fill:var(--input)} .process{fill:var(--process)}
  .storage{fill:var(--storage)} .external{fill:var(--external)}
  .risk{fill:var(--risk)} .neutral{fill:var(--neutral)}
  .edge{stroke:var(--line);stroke-width:1.8;fill:none}
  .feedback{stroke:#0f766e;stroke-width:2;fill:none;stroke-dasharray:6 4}
  .zone{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:6 5}
</style>
<main>
<svg viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Market-anchored adaptive conformal forecast triage</title>
  <desc id="desc">Leakage-controlled data and market odds feed forecasting models, validation-selected market anchoring, temporal class-conditional conformal calibration, and a three-action decision layer with outcome feedback.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="greenArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0f766e"/></marker>
  </defs>

  <text class="title" x="600" y="34" text-anchor="middle">Market-Anchored Adaptive Conformal Forecast Triage</text>

  <!-- Connectors are drawn before nodes. -->
  <path class="edge" marker-end="url(#arrow)" d="M205 165 H280"/>
  <path class="edge" marker-end="url(#arrow)" d="M205 290 H280"/>
  <path class="edge" marker-end="url(#arrow)" d="M455 165 H525"/>
  <path class="edge" marker-end="url(#arrow)" d="M455 290 C485 290 495 220 525 220"/>
  <path class="edge" marker-end="url(#arrow)" d="M695 205 H765"/>
  <path class="edge" marker-end="url(#arrow)" d="M935 205 H1005"/>
  <path class="edge" marker-end="url(#arrow)" d="M1090 260 V340"/>
  <path class="edge" marker-end="url(#arrow)" d="M1090 420 V482"/>
  <path class="feedback" marker-end="url(#greenArrow)" d="M1045 558 C820 615 675 575 650 335"/>

  <rect class="zone" x="255" y="82" width="465" height="280" rx="14"/>
  <text class="small" x="273" y="105">PROBABILITY LAYER · validation only</text>
  <rect class="zone" x="742" y="82" width="218" height="280" rx="14"/>
  <text class="small" x="760" y="105">RISK-CONTROL LAYER</text>

  <rect class="node input" x="30" y="120" width="175" height="90" rx="12"/>
  <text class="label" x="118" y="151" text-anchor="middle">Pre-match data</text>
  <text class="small" x="118" y="176" text-anchor="middle">form · xG · rank</text>
  <text class="small" x="118" y="195" text-anchor="middle">strict temporal cutoff</text>

  <rect class="node external" x="30" y="245" width="175" height="90" rx="12"/>
  <text class="label" x="118" y="276" text-anchor="middle">Closing market</text>
  <text class="small" x="118" y="301" text-anchor="middle">de-vigged 1X2 odds</text>
  <text class="small" x="118" y="320" text-anchor="middle">strong external prior</text>

  <rect class="node process" x="280" y="120" width="175" height="90" rx="12"/>
  <text class="label" x="368" y="151" text-anchor="middle">AI forecasters</text>
  <text class="small" x="368" y="176" text-anchor="middle">XGBoost · RF · LLM</text>
  <text class="small" x="368" y="195" text-anchor="middle">probability triples</text>

  <rect class="node external" x="280" y="245" width="175" height="90" rx="12"/>
  <text class="label" x="368" y="276" text-anchor="middle">Market anchor</text>
  <text class="small" x="368" y="301" text-anchor="middle">convex probability blend</text>
  <text class="small" x="368" y="320" text-anchor="middle">weight selected pre-test</text>

  <rect class="node storage" x="525" y="150" width="170" height="110" rx="12"/>
  <text class="label" x="610" y="180" text-anchor="middle">Temporal calibration</text>
  <text class="small" x="610" y="205" text-anchor="middle">previous-season scores</text>
  <text class="small" x="610" y="224" text-anchor="middle">separate H / D / A</text>
  <text class="small" x="610" y="243" text-anchor="middle">no test tuning</text>

  <rect class="node process" x="765" y="140" width="170" height="130" rx="12"/>
  <text class="label" x="850" y="171" text-anchor="middle">Adaptive Mondrian</text>
  <text class="label" x="850" y="191" text-anchor="middle">conformal sets</text>
  <text class="small" x="850" y="217" text-anchor="middle">target class coverage</text>
  <text class="small" x="850" y="236" text-anchor="middle">match-day updates only</text>
  <text class="small" x="850" y="255" text-anchor="middle">distribution-shift tracking</text>

  <rect class="node neutral" x="1005" y="120" width="170" height="140" rx="12"/>
  <text class="label" x="1090" y="151" text-anchor="middle">Prediction set</text>
  <text class="small" x="1090" y="179" text-anchor="middle">{H} · {H,A} · {H,D,A}</text>
  <text class="small" x="1090" y="204" text-anchor="middle">size quantifies</text>
  <text class="small" x="1090" y="223" text-anchor="middle">decision difficulty</text>

  <rect class="node process" x="1005" y="340" width="170" height="80" rx="12"/>
  <text class="label" x="1090" y="371" text-anchor="middle">Forecast triage</text>
  <text class="small" x="1090" y="397" text-anchor="middle">route by set size</text>

  <rect class="node storage" x="755" y="482" width="125" height="76" rx="10"/>
  <text class="label" x="818" y="511" text-anchor="middle">Automate</text>
  <text class="small" x="818" y="536" text-anchor="middle">singleton</text>
  <rect class="node external" x="897" y="482" width="125" height="76" rx="10"/>
  <text class="label" x="960" y="511" text-anchor="middle">Review</text>
  <text class="small" x="960" y="536" text-anchor="middle">doubleton</text>
  <rect class="node risk" x="1039" y="482" width="125" height="76" rx="10"/>
  <text class="label" x="1102" y="511" text-anchor="middle">Abstain</text>
  <text class="small" x="1102" y="536" text-anchor="middle">full set</text>

  <path class="edge" marker-end="url(#arrow)" d="M1090 420 C1090 455 818 450 818 482"/>
  <path class="edge" marker-end="url(#arrow)" d="M1090 420 C1090 455 960 450 960 482"/>
  <path class="edge" marker-end="url(#arrow)" d="M1090 420 V482"/>

  <text class="small" x="626" y="604" text-anchor="middle" fill="#0f766e">Observed outcomes update thresholds only for subsequent match days</text>
  <text class="tiny" x="30" y="630">LLM audit: a second-stage model is retained only if it adds paired out-of-sample value within review cases.</text>
</svg>
</main>
